stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

services:
  - docker:dind

build:
  stage: build
  image: docker:latest
  tags:
    - docker
  script:
    - docker info
    - docker build -t hello-app .

deploy:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  script:
    - docker stop hello-container || true
    - docker rm hello-container || true
    - docker run -d -p 5000:5000 --name hello-container hello-app
