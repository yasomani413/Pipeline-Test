image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - deploy

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build:
  stage: build
  tags:
    - docker
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  tags:
    - docker
  script:
    - apk add --no-cache openssh-client
    - ssh -p 5000 yash@172.16.10.203 "docker pull $CI_REGISTRY_IMAGE:latest"
    - ssh -p 5000 yash@172.16.10.203 "docker stop hello-container || true"
    - ssh -p 5000 yash@172.16.10.203 "docker rm hello-container || true"
    - ssh -p 5000 yash@172.16.10.203 "docker run -d -p 5000:5000 --name hello-container $CI_REGISTRY_IMAGE:latest"
