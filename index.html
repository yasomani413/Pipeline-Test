<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    .form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .form input { flex: 1; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .form button { padding: 0.6rem 1.2rem; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .form button:hover { background: #2563eb; }
    .task { display: flex; align-items: center; gap: 0.75rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
    .task.done span { text-decoration: line-through; color: #9ca3af; }
    .task span { flex: 1; font-size: 0.95rem; }
    .task input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    .del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; }
    .del:hover { color: #b91c1c; }
    .empty { text-align: center; color: #9ca3af; padding: 2rem; }
  </style>
</head>
<body>
  <h1>📋 Task List</h1>
  <div class="form">
    <input id="inp" type="text" placeholder="New task..." />
    <button onclick="addTask()">Add</button>
  </div>
  <div id="list"></div>

  <script>
    const API = window.location.origin;

    async function load() {
      const res = await fetch(`${API}/tasks`);
      const tasks = await res.json();
      const list = document.getElementById("list");
      if (!tasks.length) { list.innerHTML = '<p class="empty">No tasks yet.</p>'; return; }
      list.innerHTML = tasks.map(t => `
        <div class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id}, this.checked)" />
          <span>${t.title}</span>
          <button class="del" onclick="del(${t.id})">✕</button>
        </div>
       `).join("");
    }

    async function addTask() {
      const inp = document.getElementById("inp");
      const title = inp.value.trim();
      if (!title) return;
      await fetch(`${API}/tasks`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      inp.value = "";
      load();
    }

    async function toggle(id, done) {
      await fetch(`${API}/tasks/${id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ done: done ? 1 : 0 })
      });
      load();
    }

    async function del(id) {
      await fetch(`${API}/tasks/${id}`, { method: "DELETE" });
      load();
    }

    document.getElementById("inp").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
    load();
  </script>
</body>
</html>
