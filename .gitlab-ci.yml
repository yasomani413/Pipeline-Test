image: docker:latest

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - deploy

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build:
  stage: build
  tags:
    - docker
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker images $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  tags:
    - docker-socket
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker stop hello-container || true
    - docker rm hello-container || true
    - docker run -d -p 5000:5000 --name hello-container $CI_REGISTRY_IMAGE:latest
