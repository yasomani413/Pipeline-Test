image: docker:latest

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "latest"   # default

stages:
  - build
  - deploy

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build:
  stage: build
  tags:
    - docker
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: ${CI_COMMIT_TAG:-latest}   # overridden per job
  script:
    - echo "Building with tag $IMAGE_TAG"
    - IMAGE_TAG=${CI_COMMIT_TAG:-latest}  # resolve in shell explicitly
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker images $CI_REGISTRY_IMAGE:$IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG

deploy:
  stage: deploy
  tags:
    - docker-socket
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - export IMAGE_TAG=${CI_COMMIT_TAG:-latest}
    - echo "Deploying tag $IMAGE_TAG"
    - docker-compose down
    - docker-compose pull
    - docker-compose up -d
